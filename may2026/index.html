<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Challenge May 2026 &middot; Aaron Kahan</title>
  <meta name="description" content="Weight loss challenge tracker for May 2026. Track weekly progress and percentage lost.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'self'; style-src 'self'; font-src 'self'; img-src 'self'; script-src 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="weight-challenge.css">
</head>
<body>
  <div class="container">
    <div class="tool-header">
      <h1 class="tool-title">Weight Challenge May 2026</h1>
    </div>

    <div class="table-container">
      <table id="challenge-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Start</th>
            <th>Week 1</th>
            <th>Week 2</th>
            <th>Week 3</th>
            <th>Week 4</th>
            <th>End</th>
            <th>Total %</th>
          </tr>
        </thead>
        <tbody id="challenge-body">
          <!-- Rendered by JS from static data -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="weekly-weights.js"></script>
  <script src="weight-challenge.js"></script>
</body>
</html>
