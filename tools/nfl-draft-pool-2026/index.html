<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 NFL Draft Pool · Aaron Kahan</title>
  <meta name="description" content="A simple tool to copy the list of NFL players for the draft pool.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'self'; style-src 'self'; font-src 'self'; img-src 'self'; script-src 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="nfl-draft-pool.css">
</head>
<body>
  <div class="container">
    <div class="tool-header">
      <h1 class="tool-title">2026 NFL Draft Pool</h1>
    </div>

    <div class="draft-layout">
      <div class="toolbar">
        <div class="toolbar-group">
          <button class="tool-btn" id="copy-btn">Copy All Players</button>
        </div>
      </div>

      <div class="status-bar" id="status-bar" aria-live="polite">
        <span class="status-message" id="status-message"></span>
        <span class="status-stats" id="status-stats"></span>
      </div>

      <div class="panels">
        <div class="panel">
          <div class="panel-header">
            <span class="panel-label">Players List</span>
          </div>
          <div id="players-list" class="players-list-content">
            <!-- Players will be inserted here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="nfl-draft-pool.js"></script>
</body>
</html>
